name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build aarch64
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM
        run: |
          chmod +x scripts/ci-build.sh
          ./scripts/ci-build.sh aarch64

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: harbour-helmsman-aarch64
          path: |
            RPMS/*.rpm
            !RPMS/*-debuginfo-*.rpm
            !RPMS/*-debugsource-*.rpm
          if-no-files-found: error
          retention-days: 14

  i18n:
    name: Translations freshness (lupdate/lrelease)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild catalogs and fail on drift
        # tools/build-qm.sh bootstraps Qt linguist tools from the PySide6
        # wheel (no system Qt needed) and fails when the committed
        # app/translations/*.ts/*.qm differ from a fresh extraction.
        run: bash tools/build-qm.sh --check

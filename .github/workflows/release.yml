name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SFOS_RELEASE: "5.2.0.15"

jobs:
  prepare:
    name: Decide release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to publish a release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^VERSION *= *//p' app/harbour-homeassistant.pro | head -1 | tr -d '[:space:]')"
          RELEASE=1
          TAG="v${VERSION}"
          SHOULD=false

          if [ "${{ github.ref_type }}" = "tag" ]; then
            RAW="${GITHUB_REF_NAME#v}"
            # Accept v0.1.9 or v0.1.9-2
            if [[ "$RAW" =~ ^([0-9]+(\.[0-9]+)*)(-([0-9]+))?$ ]]; then
              VERSION="${BASH_REMATCH[1]}"
              if [ -n "${BASH_REMATCH[4]:-}" ]; then
                RELEASE="${BASH_REMATCH[4]}"
              fi
              TAG="v${VERSION}"
              if [ "$RELEASE" != "1" ]; then
                TAG="v${VERSION}-${RELEASE}"
              fi
            else
              echo "::error::Tag '${GITHUB_REF_NAME}' must look like v0.1.9 or v0.1.9-2"
              exit 1
            fi
            PRO_VERSION="$(sed -n 's/^VERSION *= *//p' app/harbour-homeassistant.pro | head -1 | tr -d '[:space:]')"
            if [ "$VERSION" != "$PRO_VERSION" ]; then
              echo "::error::Tag version ${VERSION} does not match .pro VERSION ${PRO_VERSION}"
              exit 1
            fi
            SHOULD=true
          elif [ "${{ github.ref_name }}" = "main" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release ${TAG} already exists — skipping publish."
              SHOULD=false
            else
              echo "No GitHub release for ${TAG} yet — will build and publish."
              SHOULD=true
            fi
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD}" >> "$GITHUB_OUTPUT"
          echo "Decision: should_release=${SHOULD} tag=${TAG} version=${VERSION} release=${RELEASE}"

  build:
    name: Build (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7hl, i486]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build RPM
        env:
          SFOS_RELEASE: ${{ env.SFOS_RELEASE }}
        run: |
          chmod +x scripts/ci-build.sh
          ./scripts/ci-build.sh "${{ matrix.arch }}" \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.release }}"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: |
            RPMS/*.rpm
            !RPMS/*-debuginfo-*.rpm
            !RPMS/*-debugsource-*.rpm
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download RPMs
        uses: actions/download-artifact@v4
        with:
          pattern: rpm-*
          path: release-rpms
          merge-multiple: true

      - name: List artifacts
        run: find release-rpms -type f -name '*.rpm' -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Helmsman ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          files: release-rpms/**/*.rpm
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
